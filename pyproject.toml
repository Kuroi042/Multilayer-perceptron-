[project]
name = "multilayer-perceptron"
version = "0.1.0"
description = "This project is an introduction to artificial neural networks through the implementation of a multilayer perceptron."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
]

[project.scripts]
multilayer-perceptron = "multilayer_perceptron:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
